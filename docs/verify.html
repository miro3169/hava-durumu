<!doctype html><html lang="tr"><head><script src="/hava-durumu/config.js"></script><script src="/hava-durumu/cloud.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-postanı doğrula · Hava</title><link rel="stylesheet" href="/hava-durumu/site.css"><link rel="icon" href="/hava-durumu/favicon.svg" type="image/svg+xml"></head><body><main class="shell"><aside class="story"><a class="brand" href="/hava-durumu/">◒ Hava</a><div><div class="sun" aria-hidden="true"></div><div class="eyebrow">GÜNÜN RİTMİNİ YAKALA</div><h1>Hava değişir.<br>Planların hazır.</h1><p>Şehrinin havasını takip et, güne bir adım önde başla.</p></div><small>Bugün için küçük bir hazırlık, gün boyu rahatlık.</small></aside><section class="panel"><div class="card"><a class="back" href="/hava-durumu/">← Hava durumuna dön</a><h2>Son bir adım.</h2><p class="sub">E-postana gelen e-postandaki kodu gir. Kodun süresi dolduysa yeni kod iste.</p><form data-mode="verify-email"><label for="email">E-posta adresi</label><input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="sen@ornek.com"><label for="code">Doğrulama kodu</label><input class="code" id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" required placeholder="000000"><button type="submit">E-postamı doğrula →</button></form><button type="button" class="secondary" id="resend">Yeni kod gönder</button><p id="message" class="notice" role="status"></p><p class="switch"><a href="/hava-durumu/login.html">Giriş sayfasına dön</a></p></div></section></main><script src="/hava-durumu/account.js" defer></script></body></html>
